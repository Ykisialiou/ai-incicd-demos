name: Demo 1 - Terraform SRE Safety Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ai-review:
    name: Terraform SRE AI Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Live Terraform Plan JSON
        run: |
          echo "::group::Terraform Init & Plan"
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          PLAN_SIZE=$(wc -c < plan.json)
          echo "::endgroup::"
          echo "✅ Generated live plan.json ($PLAN_SIZE bytes)"
          echo "### 📦 Terraform Plan Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Plan file size: $PLAN_SIZE bytes" >> $GITHUB_STEP_SUMMARY

      - name: Install Antigravity CLI (agy)
        run: |
          echo "::group::Installing agy CLI"
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH
          echo "::endgroup::"
          echo "✅ agy CLI installed"

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json
          echo "✅ agy CLI configured with Gemini 3.5 Flash (Low)"

      - name: "Generate Change Management RFC (AI Agent)"
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 📑 STEP: AI Agent Generating Change Management RFC from plan.json"
          echo "================================================================================"

          # Build prompt in a temp file to avoid YAML escaping issues
          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          cat > /tmp/rfc_prompt.txt <<PROMPT_EOF
          You are an enterprise SRE Lead and Change Advisory Board (CAB) Lead.
          Based on the following live Terraform plan JSON, generate a formal, complete, production-ready Change Management RFC (Request For Comments) markdown document.

          Structure the RFC with the following exact sections:
          1. Title line with # RFC-20260831-01: Production Infrastructure Release
          2. Header with Status: PENDING_CAB_REVIEW, Target Window: Next Maintenance Window, Author: SRE AI Automation Agent
          3. Metadata and Approvals Table (Service Affected, Environment, Risk Level, Blast Radius Score out of 10, Expected Downtime, Required Reviewers)
          4. Executive Summary and Business Justification
          5. Detailed Infrastructure Changes Table (Resource Name, Provider Type, Action CREATE/UPDATE/REPLACE/DESTROY, SRE Blast Radius and Risk)
          6. Critical Warnings (Highlight any destructive database recreations, DNS scope creep, or open security groups)
          7. Rollback and Contingency Plan (Specific triggers, rollback command, and database snapshot recovery steps)
          8. Post-Release Verification Checklist (Checkbox list with verification steps)

          === INPUT TERRAFORM PLAN JSON ===
          ${PLAN_CONTENT}
          PROMPT_EOF

          PROMPT=$(cat /tmp/rfc_prompt.txt)
          echo "📋 Prompt size: $(echo "$PROMPT" | wc -c) bytes"
          echo "🤖 Calling agy (Gemini 3.5 Flash)..."

          echo "::group::agy RFC generation output"
          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee live_generated_rfc.md
          AGY_EXIT=$?
          echo "::endgroup::"

          echo "📊 agy exit code: $AGY_EXIT"
          echo "📄 RFC output size: $(wc -c < live_generated_rfc.md) bytes"
          echo "📄 RFC output lines: $(wc -l < live_generated_rfc.md)"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📑 AI Generated Change Management RFC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat live_generated_rfc.md >> $GITHUB_STEP_SUMMARY

          echo "================================================================================"
          echo " 🚀 Publishing RFC to Notion"
          echo "================================================================================"
          TARGET_PAGE_ID="${NOTION_PAGE_ID:-Change-management-3ccf0d2a78318057b0ebfcff2b19caf8}"
          echo "📋 Notion target page ID: $TARGET_PAGE_ID"
          NOTION_PAGE_ID="$TARGET_PAGE_ID" python3 demos/demo1-terraform-analyzer/publish_notion_rfc.py --input live_generated_rfc.md

      - name: "Run SRE Safety Review (AI Agent)"
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🤖 STEP: AI Agent SRE Safety Review of plan.json"
          echo "================================================================================"

          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          cat > /tmp/review_prompt.txt <<PROMPT_EOF
          Perform a comprehensive SRE and Security review of the following Terraform plan JSON. Evaluate destructive replacements, blast radius score (0-10), security group ingress risks, and provide a clear Gate Verdict and HCL remediation patch.

          === INPUT TERRAFORM PLAN JSON ===
          ${PLAN_CONTENT}
          PROMPT_EOF

          PROMPT=$(cat /tmp/review_prompt.txt)
          echo "📋 Prompt size: $(echo "$PROMPT" | wc -c) bytes"
          echo "🤖 Calling agy (Gemini 3.5 Flash)..."

          echo "::group::agy SRE review output"
          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee terraform_review.md
          AGY_EXIT=$?
          echo "::endgroup::"

          echo "📊 agy exit code: $AGY_EXIT"
          echo "📄 Review output size: $(wc -c < terraform_review.md) bytes"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🤖 SRE Safety Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat terraform_review.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Safety Review Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('terraform_review.md')) {
              const reviewBody = fs.readFileSync('terraform_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewBody
              });
            }
