name: Demo 1 - Terraform SRE Safety Gate

on:
  push:
    branches: [main]
    paths:
      - 'demos/demo1-terraform-analyzer/**'
  pull_request:
    paths:
      - 'demos/demo1-terraform-analyzer/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ai-review:
    name: Terraform SRE AI Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Live Terraform Plan JSON
        run: |
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          echo "Generated live plan.json ($(wc -c < plan.json) bytes)"

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Run AI Agent Terraform Review (agy)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🤖 Invoking Antigravity SRE Agent on live plan.json"
          echo "================================================================================"
          
          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          PROMPT="Perform a comprehensive SRE and Security review of the following Terraform plan JSON. Evaluate destructive replacements, blast radius score (0-10), security group ingress risks, and provide a clear State Gate Verdict and HCL remediation patch.

=== [INPUT TERRAFORM PLAN JSON] ===
$PLAN_CONTENT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee terraform_review.md
          
          echo "# Demo 1: Terraform Plan SRE Safety Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat terraform_review.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Publish Live Change Management RFC to Notion
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID || 'Change-management-3ccf0d2a78318057b0ebfcff2b19caf8' }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 📑 AI Agent Generating Live Change Management RFC Document from Plan JSON"
          echo "================================================================================"
          
          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          RFC_PROMPT="You are an enterprise SRE Lead and Change Advisory Board (CAB) Lead.
Based on the following live Terraform plan JSON, generate a formal, complete, production-ready Change Management RFC (Request For Comments) markdown document.

Structure the RFC with the following exact sections:
1. Title line with # RFC-20260831-01: Production Infrastructure Release
2. Header with Status: PENDING_CAB_REVIEW, Target Window: Next Maintenance Window, Author: SRE AI Automation Agent
3. Metadata & Approvals Table (Service Affected, Environment, Risk Level, Blast Radius Score out of 10, Expected Downtime, Required Reviewers)
4. Executive Summary & Business Justification
5. Detailed Infrastructure Changes Table (Resource Name, Provider Type, Action [CREATE/UPDATE/REPLACE/DESTROY], SRE Blast Radius & Risk)
6. Critical Warnings (Highlight any destructive database recreations, DNS scope creep, or open security groups)
7. Rollback & Contingency Plan (Specific triggers, rollback command, and database snapshot recovery steps)
8. Post-Release Verification Checklist (Checkbox list with verification steps, e.g. Datadog dashboards, smoke tests, security group audits)

=== [INPUT TERRAFORM PLAN JSON] ===
$PLAN_CONTENT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$RFC_PROMPT" --dangerously-skip-permissions < /dev/null | tee live_generated_rfc.md

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📑 AI Generated Change Management RFC" >> $GITHUB_STEP_SUMMARY
          cat live_generated_rfc.md >> $GITHUB_STEP_SUMMARY

          echo "================================================================================"
          echo " 🚀 Publishing Live AI-Generated RFC to Notion"
          echo "================================================================================"
          python3 demos/demo1-terraform-analyzer/publish_notion_rfc.py --input live_generated_rfc.md

      - name: Post PR Safety Review Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('terraform_review.md')) {
              const reviewBody = fs.readFileSync('terraform_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewBody
              });
            }
