name: Demo 1 - Terraform SRE Safety Gate

on:
  pull_request:
    paths:
      - 'demos/demo1-terraform-analyzer/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and analyze (default: main)'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini"}' > ~/.antigravity/settings.json

      - name: Run Demo 1 - Terraform Analyzer Agent (agy)
        id: agent_analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY || secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID || '3ccf0d2a78318057b0ebfcff2b19caf8' }}
        run: |
          chmod +x demos/demo1-terraform-analyzer/run_demo.sh
          ./demos/demo1-terraform-analyzer/run_demo.sh | tee terraform_review.md
          
          # Append to GitHub Step Summary
          cat terraform_review.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Safety Review Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('terraform_review.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });
