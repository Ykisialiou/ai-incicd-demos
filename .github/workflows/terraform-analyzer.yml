name: Demo 1 - Terraform SRE Safety Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CLAUDE_MODEL: claude-sonnet-5
  # Replaces Claude Code's default agentic system prompt. Without this the CLI
  # primes the model to reach for tools (e.g. "let me check project memory");
  # with --tools "" there is nothing to call, so it narrates the tool call as
  # prose and returns no report while still exiting 0.
  AGENT_SYSTEM_PROMPT: >-
    You are a non-interactive report generator running inside a CI pipeline.
    You have no tools, no filesystem access, and no memory, and you must never
    announce, narrate, or emit a tool call. Everything you need is in the user
    message. Respond with the finished document only.

jobs:
  terraform-ai-review:
    name: Terraform SRE AI Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Live Terraform Plan JSON
        run: |
          echo "::group::Terraform Init & Plan"
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          PLAN_SIZE=$(wc -c < plan.json)
          echo "::endgroup::"
          echo "✅ Generated live plan.json ($PLAN_SIZE bytes)"
          echo "### 📦 Terraform Plan Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Plan file size: $PLAN_SIZE bytes" >> $GITHUB_STEP_SUMMARY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: |
          echo "::group::Installing Claude Code CLI"
          npm install -g @anthropic-ai/claude-code
          claude --version
          echo "::endgroup::"
          echo "✅ claude CLI installed"

      - name: Verify Anthropic Credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY present (${#ANTHROPIC_API_KEY} chars)"
          echo "🤖 Model: $CLAUDE_MODEL"

      - name: "SRE Safety Review (AI Agent + Architecture Policy)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🤖 STEP: AI Agent reviewing plan.json WITH architecture context"
          echo "================================================================================"

          AGENT_DIR=agent_instructions/terraform_analyzer_agent
          SYSTEM_PROMPT=$(cat "$AGENT_DIR/system_prompt.md")
          ARCHITECTURE_POLICY=$(cat "$AGENT_DIR/architecture_policy.md")
          BLAST_RADIUS_RULES=$(cat "$AGENT_DIR/blast_radius_rules.md")
          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)

          echo "📚 Context loaded:"
          echo "   - system_prompt.md        $(wc -c < "$AGENT_DIR/system_prompt.md") bytes"
          echo "   - architecture_policy.md  $(wc -c < "$AGENT_DIR/architecture_policy.md") bytes"
          echo "   - blast_radius_rules.md   $(wc -c < "$AGENT_DIR/blast_radius_rules.md") bytes"

          cat > /tmp/review_prompt.txt <<PROMPT_EOF
          ${SYSTEM_PROMPT}

          === CORPORATE ARCHITECTURE & GOVERNANCE POLICY (source file: agent_instructions/terraform_analyzer_agent/architecture_policy.md) ===
          ${ARCHITECTURE_POLICY}

          === BLAST RADIUS CLASSIFICATION RULES (source file: agent_instructions/terraform_analyzer_agent/blast_radius_rules.md) ===
          ${BLAST_RADIUS_RULES}


          === TASK ===
          Perform a comprehensive SRE and Security review of the Terraform plan JSON below.
          Evaluate destructive replacements, blast radius score (0-10), security group ingress risks, and provide a clear Gate Verdict and HCL remediation patch.

          Fill BOTH verdict columns: the Static Verdict a standard IaC linter (tfsec/checkov/trivy config) would give - it reads attributes and catches open CIDRs, missing encryption and similar, but knows nothing of the policy above - and your contextual verdict after also applying that policy.

          - Look up every DNS record name and every CloudFront alias in the Protected Domain Registry before scoring it.
          - Where the two columns differ, name the rule or registry row that justifies it, citing the source file by the exact path in the section header above - never invent a filename.
          - Where they agree, say so plainly. Do not manufacture risk to look thorough.
          - Keep the whole report under 60 lines.

          Output only the markdown report, with no preamble and without wrapping the whole response in a code fence.

          === INPUT TERRAFORM PLAN JSON ===
          ${PLAN_CONTENT}
          PROMPT_EOF

          echo "📋 Prompt size: $(wc -c < /tmp/review_prompt.txt) bytes"
          echo "🤖 Calling claude ($CLAUDE_MODEL)..."

          echo "::group::claude SRE review output"
          claude -p --model "$CLAUDE_MODEL" --output-format text \
            --tools "" --setting-sources "" \
            --system-prompt "$AGENT_SYSTEM_PROMPT" < /tmp/review_prompt.txt | tee terraform_review.md
          CLAUDE_EXIT=$?
          echo "::endgroup::"
          python3 scripts/strip_code_fence.py terraform_review.md
          python3 scripts/validate_agent_output.py terraform_review.md --min-bytes 400 --label "terraform review"

          echo "📊 claude exit code: $CLAUDE_EXIT"
          echo "📄 Review output size: $(wc -c < terraform_review.md) bytes"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧠 SRE Safety Review (AI Agent + architecture policy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat terraform_review.md >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ **Advisory gate**: this job reports the verdict but does not fail the build." >> $GITHUB_STEP_SUMMARY

      - name: Post PR Safety Review Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('terraform_review.md')) {
              const reviewBody = fs.readFileSync('terraform_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewBody
              });
            }

      - name: "Publish Production Infrastructure Release RFC (Final Step)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 📑 STEP: AI Agent Generating Change Management RFC from plan.json"
          echo "================================================================================"

          # Build prompt in a temp file to avoid YAML escaping issues and ARG_MAX limits
          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          cat > /tmp/rfc_prompt.txt <<PROMPT_EOF
          You are an enterprise SRE Lead and Change Advisory Board (CAB) Lead.
          Based on the following live Terraform plan JSON, generate a formal, complete, production-ready Change Management RFC (Request For Comments) markdown document.

          Structure the RFC with the following exact sections:
          1. Title line with # RFC-20260831-01: Production Infrastructure Release
          2. Header with Status: PENDING_CAB_REVIEW, Target Window: Next Maintenance Window, Author: SRE AI Automation Agent
          3. Metadata and Approvals Table (Service Affected, Environment, Risk Level, Blast Radius Score out of 10, Expected Downtime, Required Reviewers)
          4. Executive Summary and Business Justification
          5. Detailed Infrastructure Changes Table (Resource Name, Provider Type, Action CREATE/UPDATE/REPLACE/DESTROY, SRE Blast Radius and Risk)
          6. Critical Warnings (Highlight any destructive database recreations, DNS scope creep, or open security groups)
          7. Rollback and Contingency Plan (Specific triggers, rollback command, and database snapshot recovery steps)
          8. Post-Release Verification Checklist (Checkbox list with verification steps)

          Output only the markdown document, with no preamble and without wrapping the whole response in a code fence.

          === INPUT TERRAFORM PLAN JSON ===
          ${PLAN_CONTENT}
          PROMPT_EOF

          echo "📋 Prompt size: $(wc -c < /tmp/rfc_prompt.txt) bytes"
          echo "🤖 Calling claude ($CLAUDE_MODEL)..."

          echo "::group::claude RFC generation output"
          claude -p --model "$CLAUDE_MODEL" --output-format text \
            --tools "" --setting-sources "" \
            --system-prompt "$AGENT_SYSTEM_PROMPT" < /tmp/rfc_prompt.txt | tee live_generated_rfc.md
          CLAUDE_EXIT=$?
          echo "::endgroup::"
          python3 scripts/strip_code_fence.py live_generated_rfc.md
          python3 scripts/validate_agent_output.py live_generated_rfc.md --min-bytes 400 --label "live generated rfc"

          echo "📊 claude exit code: $CLAUDE_EXIT"
          echo "📄 RFC output size: $(wc -c < live_generated_rfc.md) bytes"
          echo "📄 RFC output lines: $(wc -l < live_generated_rfc.md)"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📑 AI Generated Change Management RFC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat live_generated_rfc.md >> $GITHUB_STEP_SUMMARY

          echo "================================================================================"
          echo " 🚀 Publishing RFC to Notion"
          echo "================================================================================"
          TARGET_PAGE_ID="${NOTION_PAGE_ID:-Change-management-3ccf0d2a78318057b0ebfcff2b19caf8}"
          echo "📋 Notion target page ID: $TARGET_PAGE_ID"
          NOTION_PAGE_ID="$TARGET_PAGE_ID" python3 demos/demo1-terraform-analyzer/publish_notion_rfc.py --input live_generated_rfc.md
