name: Demo 4 - AI Verifier Safety Gate

on:
  pull_request:
    paths:
      - 'demos/demo4-ai-verifier-gate/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and analyze (default: main)'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  two-stage-ai-verification:
    name: 2-Stage AI Generation & Verifier Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Live Terraform Plan JSON
        run: |
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          echo "Generated live plan.json ($(wc -c < plan.json) bytes)"

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Stage 1 - Primary AI Agent (Live Analysis)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          echo "================================================================================"
          echo " 🤖 STAGE 1: Primary AI Agent Analyzing Terraform Plan"
          echo "================================================================================"

          PROMPT_STAGE1="System Instructions:
          $(cat agent_instructions/terraform_analyzer_agent/system_prompt.md)

          Task:
          Analyze this Terraform plan and summarize the key infrastructure changes and security posture.

          Input Plan JSON:
          $(cat demos/demo1-terraform-analyzer/terraform/plan.json)"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT_STAGE1" --dangerously-skip-permissions | tee stage1_ai_analysis.md

      - name: Stage 2 - Verifier AI Agent (LLM-as-a-Judge Audits Stage 1 Live)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          echo "================================================================================"
          echo " 🛡️ STAGE 2: Verifier Agent (LLM-as-a-Judge) Auditing Stage 1 Report"
          echo "================================================================================"

          PROMPT_STAGE2="System Instructions:
          $(cat agent_instructions/verifier_agent/system_prompt.md)

          === TASK INSTRUCTIONS ===
          Verify the candidate AI report generated in Stage 1 against the raw ground truth plan.json.
          Output strictly valid JSON with keys: verification_passed, factual_accuracy_score, audit_verdict, hallucinations_detected, inconsistencies, summary.

          === [GROUND TRUTH: RAW INPUT DATA] ===
          $(cat demos/demo1-terraform-analyzer/terraform/plan.json)

          === [AI GENERATED REPORT TO AUDIT (LIVE FROM STAGE 1)] ===
          $(cat stage1_ai_analysis.md)"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT_STAGE2" --dangerously-skip-permissions | tee stage2_audit_verdict.json

      - name: Publish 2-Stage Verification Results to Step Summary
        if: always()
        run: |
          echo "# Demo 4: 2-Stage AI Verifier & Anti-Hallucination Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🤖 Stage 1: Live Primary AI Agent Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -f stage1_ai_analysis.md ]; then
            cat stage1_ai_analysis.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🛡️ Stage 2: Live LLM-as-a-Judge Audit Verdict" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f stage2_audit_verdict.json ]; then
            cat stage2_audit_verdict.json >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
