name: Demo 4 - AI Verifier Safety Gate

on:
  pull_request:
    paths:
      - 'demos/demo4-ai-verifier-gate/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and analyze (default: main)'
        required: true
        default: 'main'
      scenario:
        description: 'Verification Scenario: all | pass | fail'
        required: false
        default: 'all'

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-verifier-evaluation:
    name: LLM-as-a-Judge Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Run AI Verifier Gate (LLM-as-a-Judge)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
          SCENARIO_INPUT: ${{ github.event.inputs.scenario || 'all' }}
        run: |
          SCENARIO="$SCENARIO_INPUT"
          MODE_ARG="all"
          if [ "$SCENARIO" = "pass" ] || [ "$SCENARIO" = "valid_pass" ]; then
            MODE_ARG="pass"
          elif [ "$SCENARIO" = "fail" ] || [ "$SCENARIO" = "hallucination_fail" ]; then
            MODE_ARG="fail"
          fi

          echo "Running Verifier in mode: $MODE_ARG"
          chmod +x ./demos/demo4-ai-verifier-gate/run_demo.sh
          ./demos/demo4-ai-verifier-gate/run_demo.sh "$MODE_ARG" | tee verifier_output.log

      - name: Publish AI Agent Audit Step Summary
        if: always()
        run: |
          if [ -f verifier_output.log ]; then
            echo "# AI Verifier & Anti-Hallucination Gate (LLM-as-a-Judge)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Live Agent Audit Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat verifier_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
