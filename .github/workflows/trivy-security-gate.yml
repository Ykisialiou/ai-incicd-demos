name: Demo 2 - Trivy DevSecOps Security Triage

on:
  pull_request:
    paths:
      - 'demos/demo2-trivy-security-analyzer/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and analyze (default: main)'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-ai-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini"}' > ~/.antigravity/settings.json

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'demos/demo2-trivy-security-analyzer/sample_app'
          format: 'json'
          output: 'trivy_report.json'

      - name: Run Trivy Security AI Agent (agy)
        id: security_agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          SCAN_FILE="trivy_report.json"
          if [ ! -s "$SCAN_FILE" ] || grep -q '"Results": \[\]' "$SCAN_FILE"; then
            SCAN_FILE="demos/demo2-trivy-security-analyzer/trivy_scan.json"
          fi

          FINAL_PROMPT="System Instructions:
$(cat agent_instructions/trivy_security_agent/system_prompt.md)

Task:
Triage this raw Trivy vulnerability scan. Compare raw findings against business risk, filter out unexploitable noise, and provide concise remediation patches.

Input Trivy Scan JSON:
$(cat "$SCAN_FILE")"

          agy -p "$FINAL_PROMPT" --dangerously-skip-permissions > security_triage.md

          # Append to GitHub Step Summary
          cat security_triage.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Security Triage Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('security_triage.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });
