name: Demo 2 - Trivy DevSecOps Security Triage

on:
  pull_request:
    paths:
      - 'demos/demo2-trivy-security-analyzer/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and analyze (default: main)'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-ai-triage:
    name: Trivy Security AI Triage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install Trivy Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Real Trivy Security Scan
        run: |
          trivy fs --format json --output trivy_scan.json demos/demo2-trivy-security-analyzer/sample_app
          echo "Generated live trivy_scan.json ($(wc -c < trivy_scan.json) bytes)"

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Run AI Agent Security Triage (agy)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🤖 Invoking Antigravity Security Agent on live Trivy Scan"
          echo "================================================================================"

          SCAN_CONTENT=$(cat trivy_scan.json)
          PROMPT="Triage this raw Trivy security scan JSON. Filter noise and unexploitable CVEs, identify root-cause base image and library updates, highlight actionable CVEs, and generate copy-paste remediation diffs.

=== [INPUT TRIVY SCAN JSON] ===
$SCAN_CONTENT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee security_triage.md

          echo "# Demo 2: Trivy DevSecOps Security AI Triage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat security_triage.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Security Triage Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('security_triage.md')) {
              const reviewBody = fs.readFileSync('security_triage.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewBody
              });
            }
