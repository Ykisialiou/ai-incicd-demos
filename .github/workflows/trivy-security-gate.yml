name: Demo 2 - Trivy DevSecOps Security Triage

on:
  push:
    branches:
      - main
    paths:
      - 'demos/demo2-trivy-security-analyzer/**'
  pull_request:
    paths:
      - 'demos/demo2-trivy-security-analyzer/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: false
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-ai-triage:
    name: Trivy Security AI Triage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: 'latest'

      - name: Run Real Trivy Security Scan
        id: trivy_scan
        run: |
          cd demos/demo2-trivy-security-analyzer
          trivy fs --format json --output trivy_scan.json sample_app
          echo "Generated live trivy_scan.json ($(wc -c < trivy_scan.json) bytes)"

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Run AI Agent Security Triage (agy)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🛡️ Invoking Antigravity Security Agent on live trivy_scan.json"
          echo "================================================================================"
          
          SCAN_CONTENT=$(cat demos/demo2-trivy-security-analyzer/trivy_scan.json)
          PROMPT="Triage the following raw Trivy security scan. 
Filter noise, identify root-cause fixes (like base image updates), highlight actionable CVEs and hardcoded secrets, and generate copy-paste remediation diffs.

Structure the response with 3 clear sections:
1. 📊 Raw Trivy Scanner Output Summary
2. 🧠 AI Agent Noise Reduction & Triage Matrix
3. 🚀 Instant Remediation Diff Patch for Dockerfile and package.json

=== [INPUT TRIVY SCAN JSON] ===
$SCAN_CONTENT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee security_triage.md
          
          echo "# Demo 2: Trivy DevSecOps Security Triage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat security_triage.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Security Triage Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('security_triage.md')) {
              const reviewBody = fs.readFileSync('security_triage.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewBody
              });
            }
