name: Demo 3 - CI Build Doctor (Failure Auto-Diagnosis)

on:
  push:
    branches:
      - main
    paths:
      - 'demos/demo3-build-failure-doctor/**'
  pull_request:
    paths:
      - 'demos/demo3-build-failure-doctor/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: false
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  build-doctor-diagnosis:
    name: Build Doctor AI Failure Diagnosis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Broken Build Simulation
        id: broken_build
        run: |
          cd demos/demo3-build-failure-doctor/sample_broken_pipeline
          chmod +x broken_build.sh
          set +e
          bash broken_build.sh > broken_build_output.log 2>&1
          EXIT_CODE=$?
          set -e
          echo "Simulated broken build exited with code $EXIT_CODE ($(wc -l < broken_build_output.log) lines)"
          echo "BUILD_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Run AI Build Doctor Diagnosis (agy)
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🩺 Invoking Antigravity Build Doctor Agent on live failed build log"
          echo "================================================================================"
          
          LOG_CONTENT=$(cat demos/demo3-build-failure-doctor/sample_broken_pipeline/broken_build_output.log)
          PROMPT="A CI/CD pipeline step failed with exit code $BUILD_EXIT_CODE.
Analyze this raw console log. Filter out download/build noise, pinpoint the exact failing line and root cause, and provide a clear 1-2-3 remediation plan.

Structure the diagnosis as follows:
1. 🎯 Failure Summary (Failing Step, Error Code, Root Cause Category)
2. 🔍 Error Pinpointing (Quote the exact 3-5 lines containing the real root cause)
3. 🚀 1-2-3 Copy-Paste Actionable Fix

=== [INPUT BUILD LOG] ===
$LOG_CONTENT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee build_doctor_report.md
          
          echo "# Demo 3: CI Build Doctor Auto-Diagnosis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat build_doctor_report.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Build Doctor Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('build_doctor_report.md')) {
              const reviewBody = fs.readFileSync('build_doctor_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reviewBody
              });
            }
