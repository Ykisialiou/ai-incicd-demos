name: CI Build Doctor (Failure Auto-Diagnosis)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash || true
          echo "$HOME/.antigravity/bin:$HOME/.local/bin" >> $GITHUB_PATH

      - name: Execute Project Build (Simulated Step)
        id: run_build
        continue-on-error: true
        run: |
          # Simulating a failure and capturing logs
          bash demos/demo3-build-failure-doctor/sample_broken_pipeline/broken_build.sh > build_output.log 2>&1
          exit $?

      - name: Run Build Doctor AI Agent on Failure (agy)
        if: steps.run_build.outcome == 'failure'
        env:
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          echo "Build failed. Invoking Build Doctor Agent..."
          ./bin/agy \
            --system-prompt agent_instructions/build_doctor_agent/system_prompt.md \
            --file build_output.log \
            --prompt "Analyze this failed build log, find the root cause, and provide a direct fix." \
            --output build_diagnosis.md

          # Append diagnosis to Step Summary
          cat build_diagnosis.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Diagnosis Comment
        uses: actions/github-script@v7
        if: steps.run_build.outcome == 'failure' && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const diagnosis = fs.readFileSync('build_diagnosis.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: diagnosis
            });

      - name: Finalize Failure Status
        if: steps.run_build.outcome == 'failure'
        run: |
          echo "Pipeline failed as expected in demo. Build Doctor has posted diagnosis."
          exit 1
