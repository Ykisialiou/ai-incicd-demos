name: Demo 4 - AI Verifier Safety Gate

on:
  push:
    branches:
      - main
    paths:
      - 'demos/demo4-ai-verifier-gate/**'
  pull_request:
    paths:
      - 'demos/demo4-ai-verifier-gate/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: false
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  two-stage-ai-verification:
    name: 2-Stage AI Generation & Verifier Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Live Terraform Plan JSON
        run: |
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json

      - name: Stage 1 - Primary AI Agent (Generate Analysis Live)
        id: stage1
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🤖 STAGE 1: Primary AI Agent Analyzing Plan"
          echo "================================================================================"
          
          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          PROMPT="Perform a comprehensive SRE and Security review of the following Terraform plan JSON. Evaluate destructive replacements, blast radius score (0-10), security group ingress risks, and provide a clear State Gate Verdict and HCL remediation patch.

=== [INPUT TERRAFORM PLAN JSON] ===
$PLAN_CONTENT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee stage1_ai_analysis.md

      - name: Stage 2 - Verifier AI Agent (LLM-as-a-Judge Audits Stage 1 Live)
        id: stage2
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🛡️ STAGE 2: Verifier Agent (LLM-as-a-Judge) Auditing Stage 1 Report"
          echo "================================================================================"
          
          GROUND_TRUTH=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          STAGE1_OUTPUT=$(cat stage1_ai_analysis.md)
          
          PROMPT="You are an AI Safety Verifier & Anti-Hallucination Gate (LLM-as-a-Judge).
Your task is to independently audit the candidate AI report against the ground-truth Terraform plan JSON.

Verify:
1. Hallucination Check: Are any resource changes invented that do not exist in the plan?
2. Blast Radius Score Accuracy: Is the score justified given destructive replacement of production database?
3. Omission Check: Did the candidate report fail to mention the critical database destroy/recreate action?

Output a JSON object with:
{
  \"audit_status\": \"PASS\" | \"FAIL\",
  \"hallucination_detected\": false | true,
  \"omission_detected\": false | true,
  \"confidence_score\": 0.0 - 1.0,
  \"findings\": [\"finding 1\", ...],
  \"verdict_summary\": \"Summary explanation\"
}

=== [GROUND TRUTH TERRAFORM PLAN JSON] ===
$GROUND_TRUTH

=== [CANDIDATE AI REPORT (STAGE 1)] ===
$STAGE1_OUTPUT"

          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee stage2_audit_verdict.json

      - name: Publish 2-Stage Verification Results to Step Summary
        run: |
          echo "# Demo 4: 2-Stage AI Verifier & Anti-Hallucination Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🤖 Stage 1: Live Primary AI Agent Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -f stage1_ai_analysis.md ]; then
            cat stage1_ai_analysis.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🛡️ Stage 2: Live LLM-as-a-Judge Audit Verdict" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f stage2_audit_verdict.json ]; then
            cat stage2_audit_verdict.json >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
