name: Demo 4 - AI Verifier Safety Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  two-stage-ai-verification:
    name: 2-Stage AI Verifier Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Live Terraform Plan JSON
        run: |
          echo "::group::Terraform Init & Plan"
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          PLAN_SIZE=$(wc -c < plan.json)
          echo "::endgroup::"
          echo "✅ Generated live plan.json ($PLAN_SIZE bytes)"

      - name: Install Antigravity CLI (agy)
        run: |
          echo "::group::Installing agy CLI"
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin:$HOME/.antigravity/bin" >> $GITHUB_PATH
          echo "::endgroup::"
          echo "✅ agy CLI installed"

      - name: Configure Antigravity CLI
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.antigravity
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.gemini/antigravity-cli/settings.json
          echo '{"modelProvider":"gemini","model":"Gemini 3.5 Flash (Low)","defaultModel":"Gemini 3.5 Flash (Low)"}' > ~/.antigravity/settings.json
          echo "✅ agy CLI configured"

      - name: "Stage 1 - Primary AI Analysis (AI Agent)"
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🤖 STAGE 1: Primary AI Agent Analyzing Terraform Plan"
          echo "================================================================================"

          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          cat > /tmp/stage1_prompt.txt <<PROMPT_EOF
          Analyze this Terraform plan and summarize the planned infrastructure changes, resource replacements, and security risks.

          === INPUT TERRAFORM PLAN JSON ===
          ${PLAN_CONTENT}
          PROMPT_EOF

          PROMPT=$(cat /tmp/stage1_prompt.txt)
          echo "📋 Stage 1 prompt size: $(echo "$PROMPT" | wc -c) bytes"
          echo "🤖 Calling agy (Gemini 3.5 Flash)..."

          echo "::group::Stage 1 agy output"
          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee stage1_ai_analysis.md
          AGY_EXIT=$?
          echo "::endgroup::"

          echo "📊 Stage 1 agy exit code: $AGY_EXIT"
          echo "📄 Stage 1 output: $(wc -c < stage1_ai_analysis.md) bytes, $(wc -l < stage1_ai_analysis.md) lines"

      - name: "Stage 2 - Verifier AI Agent (LLM-as-a-Judge)"
        env:
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          set -o pipefail
          echo "================================================================================"
          echo " 🛡️ STAGE 2: Verifier Agent (LLM-as-a-Judge) Auditing Stage 1"
          echo "================================================================================"

          PLAN_CONTENT=$(cat demos/demo1-terraform-analyzer/terraform/plan.json)
          REPORT_CONTENT=$(cat stage1_ai_analysis.md)
          cat > /tmp/stage2_prompt.txt <<PROMPT_EOF
          Act as an impartial AI Verifier and Auditor (LLM-as-a-Judge). Verify the candidate report (Stage 1 Report) against the ground truth (plan.json). Output strictly raw JSON with keys: verification_passed (bool), factual_accuracy_score (0-100), audit_verdict (APPROVED or REJECTED), hallucinations_detected (list of strings), inconsistencies (list of strings), summary (string).

          === GROUND TRUTH: RAW INPUT DATA ===
          ${PLAN_CONTENT}

          === AI GENERATED REPORT TO AUDIT (STAGE 1 REPORT) ===
          ${REPORT_CONTENT}
          PROMPT_EOF

          PROMPT=$(cat /tmp/stage2_prompt.txt)
          echo "📋 Stage 2 prompt size: $(echo "$PROMPT" | wc -c) bytes"
          echo "🤖 Calling agy (Gemini 3.5 Flash)..."

          echo "::group::Stage 2 agy verifier output"
          agy --model "Gemini 3.5 Flash (Low)" -p "$PROMPT" --dangerously-skip-permissions < /dev/null | tee stage2_audit_verdict.json
          AGY_EXIT=$?
          echo "::endgroup::"

          echo "📊 Stage 2 agy exit code: $AGY_EXIT"
          echo "📄 Stage 2 output: $(wc -c < stage2_audit_verdict.json) bytes"

      - name: Publish 2-Stage Results to Step Summary
        if: always()
        run: |
          echo "# Demo 4: 2-Stage AI Verifier Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🤖 Stage 1: Primary AI Agent Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f stage1_ai_analysis.md ]; then
            cat stage1_ai_analysis.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Stage 1 output not found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🛡️ Stage 2: LLM-as-a-Judge Audit Verdict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f stage2_audit_verdict.json ]; then
            cat stage2_audit_verdict.json >> $GITHUB_STEP_SUMMARY
          else
            echo '{"error": "Stage 2 output not found"}' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
