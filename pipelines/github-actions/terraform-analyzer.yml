name: Demo 1 - Terraform SRE Safety Gate

on:
  pull_request:
    paths:
      - 'demos/demo1-terraform-analyzer/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and analyze (default: main)'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash || true
          echo "$HOME/.antigravity/bin:$HOME/.local/bin" >> $GITHUB_PATH

      - name: Terraform Init & Plan
        id: tf_plan
        run: |
          cd demos/demo1-terraform-analyzer/terraform
          terraform init -backend=false
          terraform plan -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Run Terraform Analyzer AI Agent (agy)
        id: agent_analysis
        env:
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          ./bin/agy \
            --system-prompt agent_instructions/terraform_analyzer_agent/system_prompt.md \
            --file demos/demo1-terraform-analyzer/terraform/plan.json \
            --prompt "Analyze this Terraform plan against architecture policy and evaluate blast radius, destructive replacements, and DNS risk." \
            --output terraform_review.md
          
          # Append to GitHub Step Summary
          cat terraform_review.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Safety Review Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('terraform_review.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });

      - name: Publish RFC to Notion / Change Management
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python3 demos/demo1-terraform-analyzer/publish_notion_rfc.py --input demos/demo1-terraform-analyzer/change_requests/RFC-20260831-01-customer-db.md
